name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the conformance suite
      # (conformance/cases.json) live in docuconf-go; the export tests vet
      # generated contracts against the one, core's tests run the other.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      # The docuconf CLI from the docuconf-go checkout: the shared export
      # check (docuconf conformance export) and the generated docs use it.
      - name: Build the docuconf CLI
        run: (cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .)

      # The docuconf-go-facing subset (conformance suite, cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      # Fails if any conformance case is skipped.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf
      # One install for the workspace: @docuconf/core, @docuconf/t3, @docuconf/nestjs.
      - run: npm ci
      - run: npm run typecheck
      # Every package's tests (vitest projects), against the TypeScript sources.
      # They include the README checks: every code block is a compiled file.
      - run: npm test
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          # The shared conformance suite (SPEC §12), run by @docuconf/core's tests.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
          # The shared export fixture, checked by docuconf conformance export.
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf
      # Builds the packages, then the orders examples (workspace members)
      # against them.
      - run: npm run build
      # npm ci could not link the SDKs' CLIs before their dist existed.
      - run: npm rebuild --ignore-scripts
      # The NestJS example compiles against the built packages, as an app would.
      - run: npx tsc -p examples/nestjs --noEmit
      # The orders examples: the committed contract.cue must be the one the
      # app exports (except metadata.generator.version, which release PRs
      # bump), and must pass the meta-schema.
      - name: Check the orders examples' contracts
        run: |
          for ex in orders-t3 orders-nestjs; do
            # Fails with a diff when contract.cue is not what the app exports
            # (ignoring metadata.generator.version, which release PRs bump).
            npm run export -w "examples/$ex"
            scripts/check-generated.sh "examples/$ex/contract.cue"
            mkdir -p "docuconf-go/spec/cue/$ex"
            cp "examples/$ex/contract.cue" "docuconf-go/spec/cue/$ex/"
            (cd docuconf-go/spec/cue && cue vet -c "./$ex")
          done
      # Every example's CONFIG.md, CONFIG.agents.md and docs.json are
      # generated from its contract.cue by docuconf docs, built from the
      # docuconf-go checkout above; they must match what it writes today.
      # These are the examples' README commands.
      - name: Generated docs are up to date
        run: |
          # The step above re-exports contract.cue in place; check the docs
          # against the committed contracts (and their generator.version).
          git checkout -- examples/*/contract.cue
          for ex in orders-t3 orders-nestjs next-t3 t3 nestjs; do
            (
              cd "examples/$ex"
              "$RUNNER_TEMP/docuconf" docs contract.cue --check CONFIG.md
              "$RUNNER_TEMP/docuconf" docs contract.cue --format agents --check CONFIG.agents.md
              "$RUNNER_TEMP/docuconf" docs contract.cue --format model --check docs.json
            )
          done
      # Install the packed packages into clean projects: t3 from .mjs and .cjs,
      # nestjs in a CommonJS NestJS 11 app and an ESM NestJS 12 consumer. Then
      # each orders example's smoke.sh: start it with valid env and check
      # /healthz and /config; start it with PORT=0 and no DATABASE_URL and
      # check it fails with missing_required and out_of_range.
      - run: npm run smoke
      # The Next.js example, as a user installs it: the packed packages with
      # Next.js in a temporary copy. next build without server configuration,
      # next start with valid and invalid configuration, a client component.
      - name: Next.js example
        run: |
          node packages/t3/dist/bin.js export examples/next-t3/src/env.ts --check examples/next-t3/contract.cue
          mkdir -p docuconf-go/spec/cue/next-t3 && cp examples/next-t3/contract.cue docuconf-go/spec/cue/next-t3/
          (cd docuconf-go/spec/cue && cue vet -c ./next-t3)
          bash examples/next-t3/smoke.sh

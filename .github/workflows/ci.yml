name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) lives in docuconf-go; the export
      # test vets generated contracts against it.
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
      - run: npm run build
